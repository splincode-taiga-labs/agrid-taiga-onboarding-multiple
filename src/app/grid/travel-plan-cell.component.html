<div class="travel-plan-cell">
    <span class="name">{{ travelPlan.title }}</span>

    <button
        appearance="flat"
        onboardingStepDirection="right"
        [attr.aria-label]="'Открыть заметки: ' + travelPlan.title"
        [onboardingStep]="
            travelNotesOnboarding?.isFirstStepTarget(travelPlan)
                ? travelNotesOnboarding?.steps?.[0] ?? null
                : null
        "
        iconStart="@tui.message-square"
        size="xs"
        tuiIconButton
        type="button"
        (click)="openNotes()"
    ></button>
</div>
